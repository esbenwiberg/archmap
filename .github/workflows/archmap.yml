# Publishes a per-commit archmap artifact for external consumers (e.g. a
# hosted diff-only review bot). The artifact is uploaded to the workflow run —
# it is NEVER committed to the repo, so there is no churn and no merge conflict.
#
# Race-condition note: both this workflow and the PR webhook fire at the same
# instant. Any consumer that reacts to the pull_request event will arrive before
# the artifact exists. Trigger downstream work on workflow_run instead:
#   on:
#     workflow_run:
#       workflows: ["archmap"]
#       types: [completed]
# That event fires only after this job finishes — the artifact is guaranteed to
# be present. See .github/workflows/archmap-review.yml for a complete example.
name: archmap

on:
  pull_request:

jobs:
  export:
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name || format('archmap-{0}', github.event.pull_request.head.sha) }}
      head-sha: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: churn (90-day window) needs real commit dates.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Build the graph whole-repo (required to compute dependents), but serve
      # only the PR's changed files via --scope. Each served entry still carries
      # its full dependents[] blast radius; archmap normalizes the diff paths
      # against its own graph keys and records any misses in `scope.missing`.
      # Run from the repo root so keys stay repo-root-relative.
      - name: Generate archmap artifact (scoped to this PR)
        run: |
          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            | npx tsx bin/archmap.ts export --scope - > archmap.json

      - name: Upload artifact (keyed by commit SHA, not committed)
        uses: actions/upload-artifact@v4
        with:
          name: archmap-${{ github.event.pull_request.head.sha }}
          path: archmap.json
          retention-days: 90
